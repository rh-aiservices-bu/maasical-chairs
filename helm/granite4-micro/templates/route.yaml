---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "granite4-micro.fullname" . }}-keda
  labels:
    {{- include "granite4-micro.labels" . | nindent 4 }}
  annotations:
    openshift.io/display-name: {{ .Values.inferenceService.displayName | default "granite4-micro" }}
    {{- if and .Values.keda.enabled .Values.httpAddon.enabled }}
    keda.sh/http-addon-enabled: "true"
    haproxy.router.openshift.io/timeout: 180s
    {{- end }}
spec:
  {{- if and .Values.keda.enabled .Values.httpAddon.enabled .Values.httpAddon.host }}
  host: {{ .Values.httpAddon.host }}
  {{- else }}
  host: ""
  {{- end }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    {{- if and .Values.keda.enabled .Values.httpAddon.enabled }}
    name: {{ include "granite4-micro.fullname" . }}-interceptor-proxy
    {{- else }}
    name: {{ include "granite4-micro.fullname" . }}-predictor
    {{- end }}
    weight: 100
  wildcardPolicy: None
{{- if and .Values.keda.enabled .Values.httpAddon.enabled }}
{{- $kedaNamespace := .Values.httpAddon.kedaNamespace | default "openshift-keda" }}
{{- $interceptorSvc := lookup "v1" "Service" $kedaNamespace "keda-add-ons-http-interceptor-proxy" }}
{{- $interceptorIP := "" }}
{{- if $interceptorSvc }}
  {{- $interceptorIP = $interceptorSvc.spec.clusterIP }}
{{- else if .Values.httpAddon.interceptorIP }}
  {{- $interceptorIP = .Values.httpAddon.interceptorIP }}
{{- else }}
  {{- fail "KEDA HTTP Add-on interceptor not found. Install HTTP Add-on or provide interceptorIP." }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "granite4-micro.fullname" . }}-interceptor-proxy
  labels:
    {{- include "granite4-micro.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ include "granite4-micro.fullname" . }}-interceptor-proxy
  labels:
    {{- include "granite4-micro.labels" . | nindent 4 }}
subsets:
  - addresses:
      - ip: {{ $interceptorIP }}
    ports:
      - port: 8080
        protocol: TCP
        name: http
{{- end }}
